<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Profile')}"></head>
<body class="app-body">
<div class="court-grid" aria-hidden="true"></div>
<header th:replace="~{fragments/nav :: header}"></header>
<main class="dashboard">
    <section class="auth-panel profile-panel">
        <p class="eyebrow">Account</p>
        <h1>Your profile</h1>
        <p class="lede">Update your contact details. Username stays as your sign-in identity.</p>
        <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
        <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
        <form id="profile-form" class="auth-form" th:action="@{/profile}" th:object="${profileUpdateRequest}" method="post" enctype="multipart/form-data" novalidate>
            <div class="field">
                <label for="username">Username</label>
                <input id="username" type="text" th:value="${username}" readonly class="is-readonly" tabindex="-1" aria-readonly="true">
            </div>
            <div class="field">
                <label>Photo</label>
                <div class="avatar-row">
                    <img class="profile-avatar" th:src="@{/avatars/{id}(id=${profileUserId})}" alt="">
                    <input id="avatar" name="avatar" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
                </div>
            </div>
            <div class="field">
                <label for="fullName">Full name</label>
                <input id="fullName" th:field="*{fullName}" type="text" autocomplete="name" required minlength="2" maxlength="100">
                <p class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></p>
                <p class="field-error" data-error-for="fullName" hidden></p>
            </div>
            <div class="field-grid">
                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" th:field="*{email}" type="email" autocomplete="email" required maxlength="254">
                    <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                    <p class="field-error" data-error-for="email" hidden></p>
                </div>
                <div class="field">
                    <label for="phone">Phone <span class="optional">(optional)</span></label>
                    <input id="phone" th:field="*{phone}" type="tel" autocomplete="tel" maxlength="20">
                    <p class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p>
                    <p class="field-error" data-error-for="phone" hidden></p>
                </div>
            </div>
            <p class="eyebrow">Password</p>
            <p class="lede">Leave blank to keep your current password.</p>
            <div class="field">
                <label for="currentPassword">Current password</label>
                <input id="currentPassword" th:field="*{currentPassword}" type="password" autocomplete="current-password">
                <p class="field-error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></p>
                <p class="field-error" data-error-for="currentPassword" hidden></p>
            </div>
            <div class="field-grid">
                <div class="field">
                    <label for="newPassword">New password</label>
                    <input id="newPassword" th:field="*{newPassword}" type="password" autocomplete="new-password" minlength="8" maxlength="72">
                    <p class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></p>
                    <p class="field-error" data-error-for="newPassword" hidden></p>
                </div>
                <div class="field">
                    <label for="confirmPassword">Confirm new password</label>
                    <input id="confirmPassword" th:field="*{confirmPassword}" type="password" autocomplete="new-password" minlength="8" maxlength="72">
                    <p class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>
                    <p class="field-error" data-error-for="confirmPassword" hidden></p>
                </div>
            </div>
            <p class="eyebrow">Skill levels</p>
            <p class="lede">Set the level you play at for each sport. Matching coaches appear when you book a court or individual session.</p>
            <div class="field" th:each="sport : ${sports}">
                <label th:for="${'level-' + sport.name()}" th:text="${sport.displayName}">Tennis</label>
                <select th:id="${'level-' + sport.name()}" th:name="${'sportLevels[' + sport.name() + ']'}">
                    <option value="">Not set</option>
                    <option th:each="level : ${sportLevelOptions.get(sport.name())}"
                            th:value="${level.code}"
                            th:text="${level.label}"
                            th:selected="${profileUpdateRequest.sportLevels.get(sport.name()) == level.code}">NTRP 3.0</option>
                </select>
            </div>
            <button class="btn btn-accent btn-block" type="submit">Save profile</button>
        </form>
    </section>
</main>
<footer th:replace="~{fragments/nav :: footer}"></footer>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/profile.js}"></script>
</body>
</html>
